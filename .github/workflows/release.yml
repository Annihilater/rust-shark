name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: rust-shark
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── 第一步：准备 tcpdump/sharkd 二进制 ───────────────────────────────────────
  prepare-binaries:
    name: 准备第三方二进制
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（为 arm64 容器做准备）
        uses: docker/setup-qemu-action@v3

      - name: 提取 tcpdump (amd64) — 直接从 runner apt 安装
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tcpdump
          # runner 本身是 amd64，直接复制
          TCPDUMP_PATH=$(command -v tcpdump)
          echo "tcpdump path: $TCPDUMP_PATH"
          cp "$TCPDUMP_PATH" assets/binaries/tcpdump-linux-amd64
          chmod +x assets/binaries/tcpdump-linux-amd64
          file assets/binaries/tcpdump-linux-amd64

      - name: 提取 tcpdump (arm64) — 通过 arm64 容器
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/assets/binaries:/out" \
            debian:bookworm \
            bash -c "
              apt-get update -qq && \
              apt-get install -y --no-install-recommends tcpdump && \
              cp /usr/bin/tcpdump /out/tcpdump-linux-arm64 && \
              chmod +x /out/tcpdump-linux-arm64
            "
          file assets/binaries/tcpdump-linux-arm64

      - name: 提取 sharkd (amd64) — 直接从 runner apt 安装
        run: |
          sudo apt-get install -y wireshark-common || true
          if command -v sharkd &>/dev/null; then
            cp "$(command -v sharkd)" assets/binaries/sharkd-linux-amd64
          else
            echo "⚠ sharkd not found on runner, using empty placeholder"
            touch assets/binaries/sharkd-linux-amd64
          fi
          chmod +x assets/binaries/sharkd-linux-amd64

      - name: 提取 sharkd (arm64) — 通过 arm64 容器
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/assets/binaries:/out" \
            debian:bookworm \
            bash -c "
              apt-get update -qq && \
              apt-get install -y --no-install-recommends wireshark-common && \
              if [ -f /usr/bin/sharkd ]; then
                cp /usr/bin/sharkd /out/sharkd-linux-arm64 && chmod +x /out/sharkd-linux-arm64
              else
                echo 'sharkd not found, placeholder' && touch /out/sharkd-linux-arm64
              fi
            "

      - name: 列出产物
        run: ls -lh assets/binaries/

      - name: 上传二进制文件
        uses: actions/upload-artifact@v4
        with:
          name: third-party-binaries
          path: assets/binaries/
          retention-days: 1

  # ─── 第二步：构建前端 WASM ─────────────────────────────────────────────────────
  build-frontend:
    name: 构建前端 WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: frontend-wasm

      - name: 安装 trunk
        uses: jetli/trunk-action@v0.5.0

      - name: 构建前端
        run: cd frontend && trunk build --release

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─── 第三步：多平台后端编译 ────────────────────────────────────────────────────
  build-backend:
    name: 构建后端 ${{ matrix.target }}
    needs: [prepare-binaries, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: rust-shark-linux-amd64
            artifact_suffix: linux-amd64
            cross: true
          - target: aarch64-unknown-linux-musl
            artifact: rust-shark-linux-arm64
            artifact_suffix: linux-arm64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: 下载第三方二进制
        uses: actions/download-artifact@v4
        with:
          name: third-party-binaries
          path: assets/binaries/

      - name: 恢复二进制执行权限
        run: chmod +x assets/binaries/*

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: backend-${{ matrix.target }}

      - name: 安装 cross
        run: cargo install cross --locked

      - name: 构建后端
        run: |
          cross build --release \
            --target ${{ matrix.target }} \
            --manifest-path backend/Cargo.toml

      - name: 重命名并验证产物
        run: |
          cp target/${{ matrix.target }}/release/rust-shark ${{ matrix.artifact }}
          # 验证是静态链接
          file ${{ matrix.artifact }}

      - name: 组装完整部署包
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DEPLOY_NAME="rust-shark-deploy-${VERSION}-${{ matrix.artifact_suffix }}"
          mkdir -p "${DEPLOY_NAME}"

          # ── 主二进制 ──
          cp "${{ matrix.artifact }}" "${DEPLOY_NAME}/rust-shark"
          chmod +x "${DEPLOY_NAME}/rust-shark"

          # ── 配置模板 ──
          cp .env.example "${DEPLOY_NAME}/.env.example"

          # ── Docker 部署支持 ──
          cp deploy/docker-compose.yml "${DEPLOY_NAME}/docker-compose.yml"
          cp deploy/common.sh          "${DEPLOY_NAME}/common.sh"
          cp deploy/start.sh           "${DEPLOY_NAME}/start.sh"
          cp deploy/stop.sh            "${DEPLOY_NAME}/stop.sh"
          cp deploy/restart.sh         "${DEPLOY_NAME}/restart.sh"
          cp deploy/logs.sh            "${DEPLOY_NAME}/logs.sh"
          cp deploy/status.sh          "${DEPLOY_NAME}/status.sh"
          chmod +x "${DEPLOY_NAME}"/*.sh

          # ── 生成 README.md ──
          cat > "${DEPLOY_NAME}/README.md" << READMEEOF
          # rust-shark ${VERSION} 部署指南

          ## 目录结构

          \`\`\`
          rust-shark-deploy-${VERSION}-${{ matrix.artifact_suffix }}/
          ├── rust-shark          # 主程序（静态链接，开箱即用）
          ├── .env.example        # 配置模板（复制为 .env 后修改）
          ├── docker-compose.yml  # Docker 部署配置
          ├── common.sh           # 公共函数（被其他脚本引用）
          ├── start.sh            # 启动服务
          ├── stop.sh             # 停止服务
          ├── restart.sh          # 重启服务
          ├── logs.sh             # 查看日志
          ├── status.sh           # 查看状态
          └── README.md           # 本文件
          \`\`\`

          ---

          ## 方式一：直接运行（推荐）

          \`\`\`bash
          # 1. 复制配置模板
          cp .env.example .env

          # 2. 按需修改配置（重点：SECRET_KEY、JWT_SECRET、ADMIN_PASSWORD）
          vim .env

          # 3. 赋予执行权限并启动
          chmod +x rust-shark
          ./rust-shark
          \`\`\`

          首次启动会自动：
          - 创建数据库（SQLite）
          - 根据 .env 中的 ADMIN_EMAIL / ADMIN_PASSWORD 创建管理员账号

          访问地址：**http://\<服务器IP\>:\<PORT\>**（默认端口 17823）

          ---

          ## 方式二：Docker Compose 部署

          \`\`\`bash
          # 1. 复制并修改配置
          cp .env.example .env
          vim .env

          # 2. 启动
          ./start.sh

          # 3. 其他操作
          ./stop.sh      # 停止
          ./restart.sh   # 重启
          ./logs.sh      # 查看日志（Ctrl+C 退出）
          ./status.sh    # 查看容器状态
          \`\`\`

          ---

          ## 关键配置说明

          | 变量 | 说明 | 默认值 |
          |------|------|--------|
          | \`PORT\` | 监听端口 | \`17823\` |
          | \`SECRET_KEY\` | 数据加密密钥（**必须修改**，32 字符以上） | 占位符 |
          | \`JWT_SECRET\` | JWT 签名密钥（**必须修改**，32 字符以上） | 占位符 |
          | \`ADMIN_EMAIL\` | 管理员登录邮箱 | \`admin@example.com\` |
          | \`ADMIN_PASSWORD\` | 管理员密码（修改后重启自动生效） | \`Admin@123456\` |
          | \`ADMIN_NAME\` | 管理员显示名称 | \`Administrator\` |
          | \`RUST_LOG\` | 日志级别（\`debug\`/\`info\`/\`warn\`/\`error\`） | \`info\` |

          > ⚠ **安全提醒**：生产环境务必修改 \`SECRET_KEY\`、\`JWT_SECRET\` 和 \`ADMIN_PASSWORD\`，
          > 并确保 \`.env\` 文件权限为 \`600\`（\`chmod 600 .env\`）。

          ---

          ## 重置管理员密码

          1. 修改 \`.env\` 中的 \`ADMIN_PASSWORD\`
          2. 重启服务（\`./restart.sh\` 或重新运行 \`./rust-shark\`）
          3. 程序启动时自动检测到密码不一致，将数据库中的密码重置为新值

          ---

          ## 系统要求

          - Linux ${{ matrix.artifact_suffix == 'linux-amd64' && 'x86_64 (amd64)' || 'ARM64 (aarch64)' }}
          - 无其他运行时依赖（静态链接二进制）
          - 如需网络抓包功能，目标服务器需安装 \`tcpdump\`

          READMEEOF

          # ── 打包 ──
          tar czf "${DEPLOY_NAME}.tar.gz" "${DEPLOY_NAME}"
          sha256sum "${DEPLOY_NAME}.tar.gz" > "${DEPLOY_NAME}.tar.gz.sha256"

          echo "--- 部署包内容 ---"
          ls -lh "${DEPLOY_NAME}/"
          echo "--- SHA256 ---"
          cat "${DEPLOY_NAME}.tar.gz.sha256"

          # 同时保留纯二进制（兼容旧版用法）
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
            rust-shark-deploy-*-${{ matrix.artifact_suffix }}.tar.gz
            rust-shark-deploy-*-${{ matrix.artifact_suffix }}.tar.gz.sha256
          retention-days: 7

  # ─── 第四步：构建并推送 Docker 镜像 ───────────────────────────────────────────
  build-docker:
    name: 构建 Docker 镜像
    needs: [prepare-binaries, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载第三方二进制
        uses: actions/download-artifact@v4
        with:
          name: third-party-binaries
          path: assets/binaries/

      - name: 恢复二进制执行权限
        run: chmod +x assets/binaries/*

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: 设置 QEMU（多平台支持）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 第五步：创建 GitHub Release ──────────────────────────────────────────────
  release:
    name: 发布 Release
    needs: [build-backend, build-docker]
    # 即使 build-docker 失败，只要二进制构建成功也能发布
    if: always() && needs.build-backend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载 amd64 产物
        uses: actions/download-artifact@v4
        with:
          name: rust-shark-linux-amd64
          path: release/

      - name: 下载 arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: rust-shark-linux-arm64
          path: release/

      - name: 列出 release 目录
        run: ls -lh release/

      - name: 生成 Release 说明
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          DOCKER_STATUS="${{ needs.build-docker.result }}"
          DOCKER_SECTION=""
          if [ "$DOCKER_STATUS" = "success" ]; then
            DOCKER_SECTION=$(cat << DOCKEREOF

          ### Docker 部署

          \`\`\`bash
          # 拉取镜像
          docker pull ghcr.io/${{ github.repository }}:${VERSION}

          # 运行（需提前准备 .env 文件）
          docker run -d \\
            --name rust-shark \\
            -p 17823:17823 \\
            -v ./data:/app/data \\
            --env-file .env \\
            ghcr.io/${{ github.repository }}:${VERSION}
          \`\`\`
          DOCKEREOF
          )
          fi

          cat > release_notes.md << EOF
          ## rust-shark ${VERSION}

          ### 下载

          推荐下载**完整部署包**（含二进制、配置模板、部署脚本、使用文档）：

          | 平台 | 部署包（推荐） | 纯二进制 |
          |------|--------------|---------|
          | Linux x86_64 | \`rust-shark-deploy-${VERSION}-linux-amd64.tar.gz\` | \`rust-shark-linux-amd64\` |
          | Linux ARM64  | \`rust-shark-deploy-${VERSION}-linux-arm64.tar.gz\`  | \`rust-shark-linux-arm64\`  |

          ### 快速部署（完整部署包）

          \`\`\`bash
          # Linux x86_64 示例
          wget https://github.com/${{ github.repository }}/releases/download/${VERSION}/rust-shark-deploy-${VERSION}-linux-amd64.tar.gz
          tar xzf rust-shark-deploy-${VERSION}-linux-amd64.tar.gz
          cd rust-shark-deploy-${VERSION}-linux-amd64

          # 复制并修改配置（务必修改 SECRET_KEY、JWT_SECRET、ADMIN_PASSWORD）
          cp .env.example .env
          vim .env

          # 直接运行
          ./rust-shark

          # 或使用 Docker Compose
          ./start.sh
          \`\`\`
          ${DOCKER_SECTION}

          ### 管理员账号

          首次启动自动根据 \`.env\` 中的 \`ADMIN_EMAIL\` / \`ADMIN_PASSWORD\` 创建管理员。
          忘记密码时，修改 \`.env\` 中的 \`ADMIN_PASSWORD\` 后重启服务即可自动重置。

          ### SHA256 校验

          \`\`\`
          EOF
          cat release/*.sha256 >> release_notes.md
          echo '```' >> release_notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "rust-shark ${{ steps.changelog.outputs.version }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            release/rust-shark-linux-amd64
            release/rust-shark-linux-arm64
            release/rust-shark-linux-amd64.sha256
            release/rust-shark-linux-arm64.sha256
            release/rust-shark-deploy-*-linux-amd64.tar.gz
            release/rust-shark-deploy-*-linux-amd64.tar.gz.sha256
            release/rust-shark-deploy-*-linux-arm64.tar.gz
            release/rust-shark-deploy-*-linux-arm64.tar.gz.sha256
