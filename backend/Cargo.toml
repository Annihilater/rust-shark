[package]
name = "backend"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rust-shark"
path = "src/main.rs"

[[bin]]
name = "create-admin"
path = "src/bin/create_admin.rs"

[dependencies]
# Web框架
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# 异步运行时
tokio.workspace = true

# 数据库
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "migrate"] }

# 序列化
serde.workspace = true
serde_json.workspace = true

# 日志
tracing.workspace = true
tracing-subscriber.workspace = true

# 错误处理
anyhow.workspace = true
thiserror.workspace = true

# 时间
chrono.workspace = true

# UUID
uuid.workspace = true

# JWT
jsonwebtoken = "9"

# 密码哈希
bcrypt = "0.16"

# AES加密
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# SSH 密钥解析
ssh-key = { version = "0.6", features = ["alloc", "std"] }
# SSH（使用 openssh crate，基于系统 OpenSSH）
openssh = { version = "0.11", features = ["process-mux"] }
tempfile = "3"

# 静态资源嵌入
rust-embed = { version = "8", features = ["include-exclude"] }

# 配置
config = "0.14"
dotenvy = "0.15"

# 定时任务
tokio-cron-scheduler = "0.15"

# 其他
bytes = "1"
futures = "0.3"
async-trait = "0.1"
hex = "0.4"
sha2 = "0.10"

mime_guess = "2"

[build-dependencies]
