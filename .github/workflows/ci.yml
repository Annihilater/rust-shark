name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: debug

jobs:
  check:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 格式化检查
        run: cargo fmt --all -- --check

      - name: Clippy 检查
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装占位符二进制
        run: |
          touch assets/binaries/tcpdump-linux-amd64
          touch assets/binaries/tcpdump-linux-arm64
          touch assets/binaries/sharkd-linux-amd64
          touch assets/binaries/sharkd-linux-arm64

      - name: 运行测试
        run: cargo test --all

  build-frontend:
    name: 构建前端 WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装 trunk
        uses: jetli/trunk-action@v0.5.0

      - name: 构建前端
        run: cd frontend && trunk build --release

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
